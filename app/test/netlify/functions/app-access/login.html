<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in â€” Parametric Studio CNC 2.1</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f1e8;color:#30291f;font:16px system-ui,sans-serif}main{width:100%;max-width:460px;background:#fffdf8;border:1px solid #d8cfc0;border-radius:14px;padding:30px;box-shadow:0 14px 40px #30291f15}h1{font-size:25px;margin:0 0 5px}.version{font-size:12px;text-transform:uppercase;font-weight:700;color:#185752}p{line-height:1.5;color:#70695f}label{display:block;font-weight:600;margin-top:18px}input,button{width:100%;font:inherit;border-radius:7px;padding:12px;margin-top:7px}input{border:1px solid #c7bdad;background:white}button{margin-top:24px;background:#27746f;color:white;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.6}#message{min-height:24px;font-size:14px}a{color:#185752}
</style></head><body><main><h1>Parametric Studio CNC</h1><div class="version">Version 2.1</div><p>Use the email address from your Gumroad purchase together with your serial number/license key.</p><form id="login"><label for="email">Purchase email</label><input id="email" name="email" type="email" autocomplete="username" required><label for="serial">Serial number / license key</label><input id="serial" name="serial" type="password" autocomplete="off" required><button id="submit" type="submit">Log in</button><p id="message" role="status" aria-live="polite"></p></form><a href="https://ozsoftware.gumroad.com/l/parametricstudio" target="_blank" rel="noopener">Get a license</a></main><script>
const form=document.getElementById('login'),button=document.getElementById('submit'),message=document.getElementById('message');
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;message.textContent='Checking your licenseâ€¦';try{if(location.protocol==='file:'){message.textContent='License login requires the deployed HTTPS website. Open /app/ on your Netlify site.';return}const result=await fetch('/app/',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.email.value.trim(),serial:form.serial.value.trim()})});if(!(result.headers.get('content-type')||'').includes('application/json')){message.textContent='Login service is not deployed or configured correctly. The site owner must deploy the app-access Netlify function and redirects.';return}const data=await result.json();if(result.ok&&data.valid){form.serial.value='';location.replace('/app/');return}message.textContent=data.message||'Unable to log in. Check your email and serial number.';}catch{message.textContent='Unable to reach the login service. Please try again.';}finally{button.disabled=false;}});
</script></body></html>
